<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手帐模块 · 开发预览</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, "PingFang SC", sans-serif;
      background: #F5F3EE;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      min-height: 100vh;
    }
    h1 { font-size: 18px; font-weight: 600; }
    .grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      display: block;
      width: 260px;
      padding: 24px;
      background: #fff;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
      text-decoration: none;
      color: inherit;
      transition: transform .15s;
    }
    .card:hover { transform: translateY(-2px); }
    .card .icon { font-size: 40px; margin-bottom: 10px; }
    .card h3 { font-size: 16px; margin-bottom: 4px; }
    .card p { font-size: 13px; color: #999; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .badge.on { background: #E8F5E9; color: #2E7D32; }
    .badge.off { background: #FFF3E0; color: #E65100; }
    .arrow { font-size: 16px; color: #bbb; text-align: center; }
  </style>
</head>
<body>
  <h1>📔 手帐模块 · 开发预览</h1>
  <div id="api-badge" class="badge">检查后端…</div>

  <div class="grid">
    <a class="card" href="album/album.html?tripId=trip001">
      <div class="icon">📷</div>
      <h3>共享相册</h3>
      <p>screen-14 · 拍照上传 · 图片直播</p>
    </a>
    <a class="card" href="journal/journal.html?tripId=trip001">
      <div class="icon">📖</div>
      <h3>探店手帐</h3>
      <p>screen-18 · 路线回顾 · 精选照片 · 评论</p>
    </a>
  </div>

  <div class="arrow">共享相册上传照片 → 结束行程 → 手帐生成</div>

  <script>
    fetch('http://localhost:4181/api/health')
      .then(r => r.json())
      .then(d => {
        const b = document.getElementById('api-badge');
        b.textContent = '✓ 后端在线 — ' + d.service;
        b.className = 'badge on';
      })
      .catch(() => {
        const b = document.getElementById('api-badge');
        b.textContent = '✗ 后端离线 (自动使用 mock)';
        b.className = 'badge off';
      });
  </script>
</body>
</html>
